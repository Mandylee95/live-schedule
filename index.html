<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라이브 방송 스케줄</title>
<style>
:root{
  --bg:#fbfbfa; --card:#fff; --line:#e6e5e1; --line2:#f0efec;
  --tx:#1c1b19; --tx2:#75736d; --tx3:#a3a19a;
  --ok:#2f7d4f; --okbg:#e8f4ec;
  --warn:#b4523a; --warnbg:#fbeeea;
  --open:#b07d1a; --openbg:#fbf3e0;
  --blk:#b8b6b0; --blkbg:#f4f3f1;
  --PD:#2f6394;     --PDbg:#e9f1f8;
  --CAM:#8a6222;    --CAMbg:#f8f0e0;
  --BANNER:#2c7566; --BANNERbg:#e4f2ee;
  --HOST:#6a4a8c;   --HOSTbg:#f1ebf8;
  --FOOD:#a3465a;   --FOODbg:#fbe9ed;
  --VMD:#5f7028;    --VMDbg:#eff4e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
button,select,input{font-family:inherit;font-size:13px;color:var(--tx);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;transition:.12s}
button,select{cursor:pointer}
button:hover,select:hover{border-color:#cfcdc7}
button:disabled{cursor:default}

/* 헤더 */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:18px;font-weight:650;letter-spacing:-.02em}
.spacer{flex:1}
.badge{font-size:11.5px;padding:5px 9px;border-radius:6px;font-weight:650}
.badge.ad{color:var(--ok);background:var(--okbg)}
.badge.lo{color:var(--warn);background:var(--warnbg)}
.ghost{border-color:transparent;background:none;color:var(--tx2);padding:8px 10px}
.ghost:hover{background:var(--line2);border-color:transparent}

/* 달력 툴바 */
.cbar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.cbar .mo{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-right:4px}
.cbar .mo small{font-size:13px;color:var(--tx3);font-weight:600;margin-left:3px}
.nav{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx2)}

/* 범례 */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:11px;font-size:11.5px;color:var(--tx2)}
.lg{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.o{background:var(--open)} .dot.f{background:var(--ok)}

/* 달력 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wd{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.wd div{padding:9px 0;text-align:center;font-size:11.5px;font-weight:650;color:var(--tx3)}
.wd div:first-child{color:#b4523a} .wd div:last-child{color:#3f6b9e}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:6px 6px 7px;text-align:left;background:none;border-radius:0;display:flex;flex-direction:column;gap:3px;
  align-items:stretch;position:relative}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:#fafaf9;border-color:var(--line2)}
.cell.out{background:#fcfcfb}
.cell.out .dn{color:#d6d4ce}
.cell.no{cursor:default}
.dn{font-size:12.5px;font-weight:650;color:var(--tx2);line-height:1.3;padding:1px 2px}
.cell.sun .dn{color:#b4523a} .cell.sat .dn{color:#3f6b9e}
.cell.today .dn{background:var(--tx);color:#fff;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:11.5px}
.chip{display:block;width:100%;text-align:left;border:none;background:var(--openbg);color:var(--open);
  border-radius:5px;padding:3px 5px;font-size:11px;font-weight:650;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip.full{background:var(--okbg);color:var(--ok)}
.chip .tm{opacity:.72;font-weight:600;margin-right:3px}
.more{font-size:10px;color:var(--tx3);padding:0 4px;font-weight:600}

/* 오버레이 / 시트 */
.ov{position:fixed;inset:0;background:rgba(28,27,25,.4);display:none;z-index:60;
  align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:14px;width:100%;max-width:480px;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)}
.sh{padding:15px 17px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.sh h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.sh .sub{font-size:12px;color:var(--tx3);font-weight:500}
.sh .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--tx3);padding:3px 6px;line-height:1}
.sb{overflow:auto;padding:12px 15px 16px}
.sf{border-top:1px solid var(--line2);padding:12px 15px;background:#fcfcfb;border-radius:0 0 14px 14px}
.btn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:700;
  background:var(--tx);color:#fff;border-color:var(--tx)}
.btn:hover{opacity:.87}
.btn.sub2{background:var(--card);color:var(--tx2);border-color:var(--line);font-weight:600}
.btn.danger{background:var(--card);color:var(--warn);border-color:#eddad3}

/* 방송 카드 (하루 안) */
.ev{border:1px solid var(--line);border-radius:11px;padding:12px 13px 11px;margin-bottom:10px;background:var(--card)}
.ev.full{border-color:#cbe0d4;background:#fcfefd}
.evh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.evt{font-size:13px;font-weight:700;color:var(--tx)}
.evn{font-size:14px;font-weight:650;margin-top:3px;letter-spacing:-.01em}
.evb{font-size:12px;color:var(--tx3);font-weight:500}
.evacts{margin-left:auto;display:flex;gap:4px}
.mini{border:none;background:none;font-size:11.5px;color:var(--tx3);padding:4px 7px;border-radius:6px;font-weight:600}
.mini:hover{background:var(--line2);color:var(--tx)}
.mini.d:hover{background:var(--warnbg);color:var(--warn)}

.rr{display:flex;align-items:center;gap:9px;padding:8px 0 0;margin-top:8px;border-top:1px solid var(--line2)}
.rc{font-size:10.5px;font-weight:700;padding:4px 0;border-radius:20px;flex:none;width:70px;text-align:center}
.rc.PD{background:var(--PDbg);color:var(--PD)} .rc.CAM{background:var(--CAMbg);color:var(--CAM)}
.rc.BANNER{background:var(--BANNERbg);color:var(--BANNER)} .rc.HOST{background:var(--HOSTbg);color:var(--HOST)}
.rc.FOOD{background:var(--FOODbg);color:var(--FOOD)} .rc.VMD{background:var(--VMDbg);color:var(--VMD)}
.rs{font-size:12.5px;font-weight:600;color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs.done{color:var(--tx3);font-weight:500}
.rs.mine{color:var(--ok)}
.act{margin-left:auto;flex:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700}
.act.go{background:var(--tx);color:#fff;border-color:var(--tx)}
.act.can{background:var(--card);color:var(--warn);border-color:#eddad3}
.act.off{background:var(--blkbg);color:var(--blk);border-color:transparent;cursor:default}

/* 관리자 신청자 목록 */
.apl{margin:6px 0 0 79px;display:flex;flex-direction:column;gap:3px}
.ap{display:flex;align-items:center;gap:8px;font-size:12px;background:#fafaf9;border-radius:7px;padding:6px 8px}
.ap b{font-weight:650}
.ap .ph{color:var(--tx2);font-variant-numeric:tabular-nums}
.ap .rm{margin-left:auto;border:none;background:none;color:var(--tx3);padding:2px 6px;font-size:13px;border-radius:5px}
.ap .rm:hover{background:var(--warnbg);color:var(--warn)}

/* 폼 */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:650;color:var(--tx2);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px 12px;font-size:14px}
.fld input:focus,.fld select:focus{outline:none;border-color:#a8a6a0}
.frow{display:flex;gap:8px}
.frow>*{flex:1;min-width:0}
.needs{display:flex;flex-direction:column;gap:6px}
.need{display:flex;align-items:center;gap:9px}
.need select{width:78px;flex:none;padding:7px 8px}
.need .nm{font-size:12.5px;font-weight:600}
.hint{font-size:12px;color:var(--tx2);background:#fafaf9;border-radius:8px;padding:10px 12px;
  line-height:1.65;margin-bottom:12px}
.hint b{color:var(--tx);font-weight:650}
.empty{padding:34px 10px;text-align:center;color:var(--tx3);font-size:13px}
.note{font-size:11.5px;color:var(--tx3);margin-top:12px;line-height:1.65}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1b19;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media(max-width:640px){
  .wrap{padding:14px 10px 80px}
  h1{font-size:16px}
  .cbar .mo{font-size:17px}
  .cell{min-height:74px;padding:4px 3px 5px;gap:2px}
  .dn{font-size:11.5px}
  .cell.today .dn{width:20px;height:20px;font-size:11px}
  .chip{font-size:9.5px;padding:2px 4px;border-radius:4px}
  .chip .tm{display:none}
  .ov{padding:0;align-items:flex-end}
  .sheet{max-width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .sf{border-radius:0}
  .rc{width:64px;font-size:10px}
  .apl{margin-left:0}
  .act{padding:9px 14px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>라이브 방송 스케줄</h1>
  <span id="mebadge"></span>
  <div class="spacer"></div>
  <button class="ghost" id="myBtn">내 신청</button>
  <button class="ghost" id="adminBtn">관리자</button>
</header>

<div class="cbar">
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>
  <span class="mo" id="moLabel"></span>
  <button class="ghost" id="today">오늘</button>
  <div class="spacer"></div>
  <button id="csvBtn" style="display:none">CSV</button>
</div>

<div class="legend">
  <span class="lg"><i class="dot o"></i> 모집중</span>
  <span class="lg"><i class="dot f"></i> 전원 마감</span>
  <span class="lg" id="adminLg" style="display:none">날짜를 누르면 방송을 추가할 수 있습니다</span>
</div>

<div class="cal">
  <div class="wd"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="grid" id="grid"></div>
</div>

<div class="note" id="note"></div>
</div>

<!-- 날짜 상세 -->
<div class="ov" id="ovDay">
  <div class="sheet">
    <div class="sh"><h2 id="dayTitle"></h2><span class="sub" id="daySub"></span>
      <button class="x" data-close="ovDay">✕</button></div>
    <div class="sb" id="dayBody"></div>
    <div class="sf" id="dayFoot" style="display:none">
      <button class="btn" id="addHere">＋ 이 날짜에 방송 추가</button>
    </div>
  </div>
</div>

<!-- 신청 폼 -->
<div class="ov" id="ovApply">
  <div class="sheet" style="max-width:400px">
    <div class="sh"><h2>신청하기</h2><span class="sub" id="applySub"></span>
      <button class="x" data-close="ovApply">✕</button></div>
    <div class="sb">
      <div class="hint" id="applyInfo"></div>
      <div class="fld"><label>이름</label>
        <input id="apName" placeholder="홍길동" maxlength="20" autocomplete="name"></div>
      <div class="fld"><label>전화번호</label>
        <input id="apPhone" placeholder="010-1234-5678" maxlength="20" inputmode="tel" autocomplete="tel"></div>
      <div class="note" style="margin:0">입력하신 연락처는 담당자만 확인합니다. 다른 신청자에게는 공개되지 않습니다.</div>
    </div>
    <div class="sf"><button class="btn" id="apSubmit">신청 확정</button></div>
  </div>
</div>

<!-- 방송 추가 / 수정 -->
<div class="ov" id="ovEdit">
  <div class="sheet">
    <div class="sh"><h2 id="editTitle">방송 추가</h2><button class="x" data-close="ovEdit">✕</button></div>
    <div class="sb">
      <div class="frow">
        <div class="fld"><label>날짜</label><input id="edDate" type="date"></div>
        <div class="fld"><label>시간</label><input id="edTime" placeholder="14:00~17:00"></div>
      </div>
      <div class="fld"><label>방송명</label><input id="edTitle" placeholder="여름 쿨링 기획전" maxlength="40"></div>
      <div class="fld"><label>브랜드</label><input id="edBrand" placeholder="라클레어" maxlength="24"></div>
      <div class="fld"><label>필요 인원</label><div class="needs" id="edNeeds"></div></div>
    </div>
    <div class="sf">
      <button class="btn" id="edSave">저장</button>
      <button class="btn danger" id="edDel" style="margin-top:8px;display:none">이 방송 삭제</button>
    </div>
  </div>
</div>

<!-- 내 신청 -->
<div class="ov" id="ovMine">
  <div class="sheet" style="max-width:420px">
    <div class="sh"><h2>내 신청 내역</h2><button class="x" data-close="ovMine">✕</button></div>
    <div class="sb" id="mineBody"></div>
    <div class="sf"><button class="btn sub2" id="findByPhone">다른 기기에서 신청했어요</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ==================== 설정 ==================== -->
<script>
var CFG = {
  adminPin: "0728",          // 관리자 비밀번호 — 원하는 값으로 바꾸세요

  // ▼ 실시간 공유를 켜려면 파이어베이스 콘솔에서 복사한 값을 붙여넣으세요.
  //    databaseURL 이 비어 있으면 '내 브라우저 저장' 모드로 동작합니다.
  firebase: {
    apiKey:      "",
    authDomain:  "",
    databaseURL: "",
    projectId:   ""
  }
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- ============================================== -->

<script>
var ROLES=['PD','CAM','BANNER','HOST','FOOD','VMD'];
var RN={PD:'PD',CAM:'카메라',BANNER:'배너제작자',HOST:'쇼호스트',FOOD:'푸드',VMD:'VMD'};
var DEF={PD:1,CAM:1,BANNER:1,HOST:2,FOOD:1,VMD:1};
var WD=['일','월','화','수','목','금','토'];
var CLOUD=!!(CFG.firebase&&CFG.firebase.databaseURL);
var LS='liveCal_v1', LSMINE='liveCal_mine', LSID='liveCal_id';

var ST={shows:{},picks:{}};
var db=null, admin=false, busy=false;
var cur=new Date(); cur.setDate(1);
var dayKey='', applyCtx=null, editId=null;
var MINE={};   // "showId|role|key" : true

try{MINE=JSON.parse(localStorage.getItem(LSMINE)||'{}')}catch(e){MINE={}}
function saveMine(){try{localStorage.setItem(LSMINE,JSON.stringify(MINE))}catch(e){}}

/* ---------- 샘플 ---------- */
function seed(){
  var shows={},i=0;
  var y=new Date().getFullYear(), m=new Date().getMonth()+1;
  var mm=(m<10?'0':'')+m;
  [['03','14:00~17:00','여름 쿨링 기획전','라클레어',2],
   ['05','20:00~22:00','프리미엄 홍삼 단독','정관장',1],
   ['08','11:00~13:00','주말 리빙 특집','모던하우스',2],
   ['12','19:00~21:00','신상 컬러 런칭','페리페라',2],
   ['14','15:00~17:30','추석 선물세트 1차','CJ제일제당',3],
   ['19','20:00~22:00','가을 신상 아우터','무신사',1],
   ['22','13:00~15:00','주말 간편식 대전','오뚜기',2],
   ['27','19:30~21:30','추석 선물세트 2차','CJ제일제당',2]]
  .forEach(function(s){i++;
    shows['b'+i]={date:y+'-'+mm+'-'+s[0],time:s[1],title:s[2],brand:s[3],
      need:{PD:1,CAM:1,BANNER:1,HOST:s[4],FOOD:1,VMD:1}}});
  return {shows:shows,picks:{}};
}

/* ---------- 저장소 ---------- */
var DB={
  init:function(onChange){
    if(CLOUD){
      try{
        firebase.initializeApp(CFG.firebase);
        db=firebase.database();
        db.ref('/').on('value',function(snap){
          var v=snap.val();
          if(!v||!v.shows){db.ref('/').set(seed());return}
          ST={shows:v.shows||{},picks:v.picks||{}};
          onChange();
        },function(){toast('연결 오류 — 파이어베이스 설정을 확인하세요.')});
      }catch(e){CLOUD=false;DB.init(onChange)}
    }else{
      try{var r=localStorage.getItem(LS);ST=r?JSON.parse(r):seed()}catch(e){ST=seed()}
      onChange();
    }
  },
  save:function(){if(!CLOUD){try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}},
  claim:function(showId,role,key,rec,cap,cb){
    if(CLOUD){
      db.ref('picks/'+showId+'/'+role).transaction(function(c){
        c=c||{};
        if(Object.keys(c).length>=cap)return;   // 정원 초과 → 취소
        c[key]=rec; return c;
      },function(err,committed){cb(!err&&committed)});
    }else{
      ST.picks[showId]=ST.picks[showId]||{};
      var g=ST.picks[showId][role]=ST.picks[showId][role]||{};
      if(Object.keys(g).length>=cap){cb(false);return}
      g[key]=rec; DB.save(); cb(true);
    }
  },
  release:function(showId,role,key,cb){
    if(CLOUD)db.ref('picks/'+showId+'/'+role+'/'+key).remove(function(){cb&&cb(true)});
    else{try{delete ST.picks[showId][role][key]}catch(e){} DB.save(); cb&&cb(true)}
  },
  setShow:function(id,obj,cb){
    if(CLOUD)db.ref('shows/'+id).set(obj,function(){cb&&cb(id)});
    else{ST.shows[id]=obj;DB.save();cb&&cb(id)}
  },
  addShow:function(obj,cb){
    var id='b'+Date.now().toString(36)+Math.floor(Math.random()*900+100);
    DB.setShow(id,obj,cb);
  },
  delShow:function(id,cb){
    var fin=function(){cb&&cb()};
    if(CLOUD)db.ref('picks/'+id).remove(function(){db.ref('shows/'+id).remove(fin)});
    else{delete ST.picks[id];delete ST.shows[id];DB.save();fin()}
  }
};

/* ---------- 헬퍼 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function need(s,r){return (s.need&&typeof s.need[r]==='number')?s.need[r]:DEF[r]}
function picksOf(id,r){var g=(ST.picks[id]||{})[r]||{};
  return Object.keys(g).sort(function(a,b){return (g[a].ts||0)-(g[b].ts||0)})
    .map(function(k){return {key:k,name:g[k].name,phone:g[k].phone}})}
function showsOn(d){var out=[];
  Object.keys(ST.shows).forEach(function(k){if(ST.shows[k].date===d)out.push(
    {id:k,date:ST.shows[k].date,time:ST.shows[k].time,title:ST.shows[k].title,
     brand:ST.shows[k].brand,need:ST.shows[k].need})});
  return out.sort(function(a,b){return String(a.time).localeCompare(String(b.time))})}
function isFull(s){return ROLES.every(function(r){return picksOf(s.id,r).length>=need(s,r)})}
function anyOpen(s){return ROLES.some(function(r){return picksOf(s.id,r).length<need(s,r)})}
function mineKey(id,r,k){return id+'|'+r+'|'+k}
function isMine(id,r,k){return !!MINE[mineKey(id,r,k)]}
function myCount(id,r){return picksOf(id,r).filter(function(p){return isMine(id,r,p.key)}).length}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on')},3000)}
function normPhone(v){return String(v||'').replace(/[^0-9]/g,'')}
function fmtPhone(v){var d=normPhone(v);
  if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return v}

/* ---------- 달력 ---------- */
function render(){
  document.getElementById('moLabel').innerHTML=
    cur.getMonth()+1+'월 <small>'+cur.getFullYear()+'</small>';
  document.getElementById('mebadge').innerHTML=
    (admin?'<span class="badge ad">관리자</span> ':'')+
    (CLOUD?'':'<span class="badge lo">내 브라우저 저장</span>');
  document.getElementById('csvBtn').style.display=admin?'':'none';
  document.getElementById('adminLg').style.display=admin?'':'none';

  var first=new Date(cur.getFullYear(),cur.getMonth(),1);
  var start=new Date(first); start.setDate(1-first.getDay());
  var todayStr=ymd(new Date());
  var h='';
  for(var i=0;i<42;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var ds=ymd(d), out=(d.getMonth()!==cur.getMonth());
    var list=showsOn(ds);
    if(out&&i>=35&&!list.length&&i%7===0)break;
    var cls='cell'+(out?' out':'')+(ds===todayStr?' today':'')
      +(d.getDay()===0?' sun':'')+(d.getDay()===6?' sat':'')
      +((!list.length&&!admin)?' no':'');
    h+='<button class="'+cls+'" data-d="'+ds+'"><span class="dn">'+d.getDate()+'</span>';
    list.slice(0,3).forEach(function(s){
      h+='<span class="chip'+(isFull(s)?' full':'')+'"><span class="tm">'
        +esc(String(s.time).split('~')[0])+'</span>'+esc(s.title)+'</span>'});
    if(list.length>3)h+='<span class="more">+'+(list.length-3)+'건</span>';
    h+='</button>';
  }
  document.getElementById('grid').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.cell'),function(b){
    if(b.classList.contains('no'))return;
    b.onclick=function(){openDay(b.dataset.d)}});

  if(document.getElementById('ovDay').classList.contains('on'))renderDay();
  if(document.getElementById('ovMine').classList.contains('on'))renderMine();

  document.getElementById('note').innerHTML= CLOUD
    ? '신청은 선착순이며, 정원이 차면 자동으로 마감됩니다. 신청자 정보는 관리자만 확인할 수 있습니다.'
    : '<b>현재는 각자 브라우저에만 저장</b>되어 서로 보이지 않습니다. 파일 안의 파이어베이스 설정을 채우면 실시간 공유가 켜집니다.';
}

/* ---------- 날짜 상세 ---------- */
function openDay(ds){dayKey=ds;document.getElementById('ovDay').classList.add('on');renderDay()}
function renderDay(){
  var d=new Date(dayKey+'T00:00:00');
  document.getElementById('dayTitle').textContent=
    (d.getMonth()+1)+'월 '+d.getDate()+'일';
  document.getElementById('daySub').textContent=WD[d.getDay()]+'요일';
  document.getElementById('dayFoot').style.display=admin?'':'none';

  var list=showsOn(dayKey), body=document.getElementById('dayBody');
  if(!list.length){body.innerHTML='<div class="empty">'+(admin
    ? '이 날짜에 등록된 방송이 없습니다.<br>아래 버튼으로 추가하세요.'
    : '이 날짜에는 예정된 방송이 없습니다.')+'</div>';return}

  var h='';
  list.forEach(function(s){
    h+='<div class="ev'+(isFull(s)?' full':'')+'">'
      +'<div class="evh"><span class="evt">'+esc(s.time)+'</span>'
      +(isFull(s)?'<span class="evb" style="color:var(--ok);font-weight:650">전원 마감</span>':'')
      +(admin?'<span class="evacts"><button class="mini" data-edit="'+s.id+'">수정</button></span>':'')
      +'</div>'
      +'<div class="evn">'+esc(s.title)+'</div>'
      +(s.brand?'<div class="evb">'+esc(s.brand)+'</div>':'');

    ROLES.forEach(function(r){
      var cap=need(s,r); if(cap<=0)return;
      var ps=picksOf(s.id,r), got=ps.length, full=got>=cap, mine=myCount(s.id,r)>0;
      var status, btn='';
      if(full)status='<span class="rs done">마감'+(cap>1?' ('+cap+'/'+cap+')':'')+'</span>';
      else status='<span class="rs">모집중 ('+got+'/'+cap+')</span>';
      if(mine)status='<span class="rs mine">✓ 내가 신청함'+(cap>1?' ('+got+'/'+cap+')':'')+'</span>';

      if(mine){
        var mk=ps.filter(function(p){return isMine(s.id,r,p.key)})[0];
        btn='<button class="act can" data-cancel="'+s.id+'|'+r+'|'+mk.key+'">취소</button>';
      }else if(!full){
        btn='<button class="act go" data-apply="'+s.id+'|'+r+'">신청</button>';
      }else{
        btn='<button class="act off" disabled>마감</button>';
      }
      h+='<div class="rr"><span class="rc '+r+'">'+RN[r]+'</span>'+status+btn+'</div>';

      if(admin&&got){
        h+='<div class="apl">'+ps.map(function(p){
          return '<div class="ap"><b>'+esc(p.name)+'</b><span class="ph">'+esc(fmtPhone(p.phone))+'</span>'
            +'<button class="rm" data-rm="'+s.id+'|'+r+'|'+p.key+'" title="신청 취소">✕</button></div>'}).join('')
          +'</div>';
      }
    });
    h+='</div>';
  });
  body.innerHTML=h;

  Array.prototype.forEach.call(body.querySelectorAll('[data-apply]'),function(b){
    b.onclick=function(){var p=b.dataset.apply.split('|');openApply(p[0],p[1])}});
  Array.prototype.forEach.call(body.querySelectorAll('[data-cancel]'),function(b){
    b.onclick=function(){var p=b.dataset.cancel.split('|');
      if(!confirm('신청을 취소할까요?'))return;
      doRelease(p[0],p[1],p[2],'신청을 취소했습니다.')}});
  Array.prototype.forEach.call(body.querySelectorAll('[data-rm]'),function(b){
    b.onclick=function(){var p=b.dataset.rm.split('|');
      if(!confirm('이 신청을 삭제할까요?'))return;
      doRelease(p[0],p[1],p[2],'삭제했습니다.')}});
  Array.prototype.forEach.call(body.querySelectorAll('[data-edit]'),function(b){
    b.onclick=function(){openEdit(b.dataset.edit)}});
}

function doRelease(id,r,k,msg){
  if(busy)return; busy=true;
  DB.release(id,r,k,function(){
    busy=false; delete MINE[mineKey(id,r,k)]; saveMine();
    if(!CLOUD)render(); else renderDay();
    toast(msg)});
}

/* ---------- 신청 ---------- */
function openApply(showId,role){
  applyCtx={showId:showId,role:role};
  var s=ST.shows[showId];
  document.getElementById('applySub').textContent=RN[role];
  document.getElementById('applyInfo').innerHTML=
    '<b>'+esc(s.date.slice(5).replace('-','.'))+' '+esc(s.time)+'</b> · '+esc(s.title)
    +'<br>역할 <b>'+RN[role]+'</b> 로 신청합니다.';
  try{
    document.getElementById('apName').value=localStorage.getItem('ls_nm')||'';
    document.getElementById('apPhone').value=localStorage.getItem('ls_ph')||'';
  }catch(e){}
  document.getElementById('ovApply').classList.add('on');
  setTimeout(function(){document.getElementById('apName').focus()},80);
}

document.getElementById('apSubmit').onclick=function(){
  if(busy||!applyCtx)return;
  var nm=document.getElementById('apName').value.trim();
  var ph=document.getElementById('apPhone').value.trim();
  if(nm.length<2){toast('이름을 입력해주세요.');document.getElementById('apName').focus();return}
  if(normPhone(ph).length<9){toast('전화번호를 정확히 입력해주세요.');document.getElementById('apPhone').focus();return}
  try{localStorage.setItem('ls_nm',nm);localStorage.setItem('ls_ph',ph)}catch(e){}

  var s=ST.shows[applyCtx.showId], r=applyCtx.role;
  var cap=need(s,r);
  var key='k'+Date.now().toString(36)+Math.floor(Math.random()*900+100);
  busy=true;
  DB.claim(applyCtx.showId,r,key,{name:nm,phone:normPhone(ph),ts:Date.now()},cap,function(ok){
    busy=false;
    if(ok){
      MINE[mineKey(applyCtx.showId,r,key)]=true; saveMine();
      document.getElementById('ovApply').classList.remove('on');
      if(!CLOUD)render(); else renderDay();
      toast('신청이 완료되었습니다.');
    }else{
      toast('한발 늦었습니다. 방금 마감되었습니다.');
      document.getElementById('ovApply').classList.remove('on');
      if(!CLOUD)render();
    }
  });
};

/* ---------- 방송 추가 / 수정 (관리자) ---------- */
function openEdit(id){
  editId=id||null;
  var s=id?ST.shows[id]:null;
  document.getElementById('editTitle').textContent=id?'방송 수정':'방송 추가';
  document.getElementById('edDate').value=s?s.date:(dayKey||ymd(new Date()));
  document.getElementById('edTime').value=s?s.time:'';
  document.getElementById('edTitle').value=s?s.title:'';
  document.getElementById('edBrand').value=s?s.brand:'';
  document.getElementById('edNeeds').innerHTML=ROLES.map(function(r){
    var v=s?need(s,r):DEF[r];
    var opts=[0,1,2,3,4,5].map(function(n){
      return '<option value="'+n+'"'+(n===v?' selected':'')+'>'+(n===0?'없음':n+'명')+'</option>'}).join('');
    return '<div class="need"><span class="rc '+r+'">'+RN[r]+'</span>'
      +'<select data-need="'+r+'">'+opts+'</select></div>'}).join('');
  document.getElementById('edDel').style.display=id?'':'none';
  document.getElementById('ovEdit').classList.add('on');
}

document.getElementById('edSave').onclick=function(){
  var date=document.getElementById('edDate').value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('날짜를 선택해주세요.');return}
  var obj={date:date,
    time:document.getElementById('edTime').value.trim()||'시간 미정',
    title:document.getElementById('edTitle').value.trim()||'(제목 없음)',
    brand:document.getElementById('edBrand').value.trim(),
    need:{}};
  Array.prototype.forEach.call(document.querySelectorAll('[data-need]'),function(sel){
    obj.need[sel.dataset.need]=parseInt(sel.value,10)||0});

  var fin=function(){
    document.getElementById('ovEdit').classList.remove('on');
    dayKey=date; cur=new Date(date+'T00:00:00'); cur.setDate(1);
    if(!CLOUD)render(); else renderDay();
    toast(editId?'수정했습니다.':'방송을 추가했습니다.')};

  if(editId)DB.setShow(editId,obj,fin);
  else DB.addShow(obj,fin);
};

document.getElementById('edDel').onclick=function(){
  if(!editId)return;
  var s=ST.shows[editId];
  if(!confirm('['+s.date+'] '+s.title+' 방송을 삭제할까요?\n신청 내역도 함께 사라집니다.'))return;
  DB.delShow(editId,function(){
    document.getElementById('ovEdit').classList.remove('on');
    if(!CLOUD)render(); else renderDay();
    toast('삭제했습니다.')});
};

/* ---------- 내 신청 내역 ---------- */
function renderMine(){
  var body=document.getElementById('mineBody'), rows=[];
  Object.keys(MINE).forEach(function(k){
    var p=k.split('|'), s=ST.shows[p[0]];
    if(!s)return;
    var still=picksOf(p[0],p[1]).some(function(x){return x.key===p[2]});
    if(!still){delete MINE[k];return}
    rows.push({id:p[0],role:p[1],key:p[2],s:s});
  });
  saveMine();
  if(!rows.length){body.innerHTML='<div class="empty">아직 신청한 방송이 없습니다.</div>';return}
  rows.sort(function(a,b){return a.s.date.localeCompare(b.s.date)});
  body.innerHTML=rows.map(function(x){
    return '<div class="ev"><div class="evh"><span class="evt">'
      +esc(x.s.date.slice(5).replace('-','.'))+' '+esc(x.s.time)+'</span></div>'
      +'<div class="evn">'+esc(x.s.title)+'</div>'
      +'<div class="rr"><span class="rc '+x.role+'">'+RN[x.role]+'</span>'
      +'<span class="rs mine">✓ 신청 완료</span>'
      +'<button class="act can" data-cancel2="'+x.id+'|'+x.role+'|'+x.key+'">취소</button></div></div>'}).join('');
  Array.prototype.forEach.call(body.querySelectorAll('[data-cancel2]'),function(b){
    b.onclick=function(){var p=b.dataset.cancel2.split('|');
      if(!confirm('신청을 취소할까요?'))return;
      DB.release(p[0],p[1],p[2],function(){
        delete MINE[mineKey(p[0],p[1],p[2])];saveMine();
        if(!CLOUD)render(); renderMine(); toast('신청을 취소했습니다.')})}});
}

document.getElementById('findByPhone').onclick=function(){
  var ph=prompt('신청할 때 입력한 전화번호를 넣어주세요.');
  if(!ph)return;
  var d=normPhone(ph); if(d.length<9){toast('전화번호를 정확히 입력해주세요.');return}
  var n=0;
  Object.keys(ST.picks||{}).forEach(function(sid){
    Object.keys(ST.picks[sid]||{}).forEach(function(r){
      Object.keys(ST.picks[sid][r]||{}).forEach(function(k){
        if(normPhone(ST.picks[sid][r][k].phone)===d){MINE[mineKey(sid,r,k)]=true;n++}})})});
  saveMine(); renderMine();
  toast(n?n+'건의 신청을 불러왔습니다.':'해당 번호로 접수된 신청이 없습니다.');
};

/* ---------- 컨트롤 ---------- */
document.getElementById('prev').onclick=function(){cur.setMonth(cur.getMonth()-1);render()};
document.getElementById('next').onclick=function(){cur.setMonth(cur.getMonth()+1);render()};
document.getElementById('today').onclick=function(){cur=new Date();cur.setDate(1);render()};
document.getElementById('myBtn').onclick=function(){
  document.getElementById('ovMine').classList.add('on');renderMine()};
document.getElementById('addHere').onclick=function(){openEdit(null)};

document.getElementById('adminBtn').onclick=function(){
  if(admin){admin=false;render();toast('관리자 모드 해제');return}
  var p=prompt('관리자 비밀번호');if(!p)return;
  if(String(p)===String(CFG.adminPin)){admin=true;render();toast('관리자 모드 — 신청자 정보 확인 및 수정 가능')}
  else toast('비밀번호가 다릅니다.')};

Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
  b.onclick=function(){document.getElementById(b.dataset.close).classList.remove('on')}});
Array.prototype.forEach.call(document.querySelectorAll('.ov'),function(o){
  o.onclick=function(e){if(e.target===o)o.classList.remove('on')}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')Array.prototype.forEach.call(document.querySelectorAll('.ov'),
    function(o){o.classList.remove('on')})});
document.getElementById('apPhone').onkeydown=function(e){
  if(e.key==='Enter')document.getElementById('apSubmit').click()};

document.getElementById('csvBtn').onclick=function(){
  var out='﻿날짜,시간,방송명,브랜드,역할,이름,전화번호\n';
  Object.keys(ST.shows).map(function(k){return {id:k,s:ST.shows[k]}})
    .sort(function(a,b){return a.s.date.localeCompare(b.s.date)})
    .forEach(function(x){
      ROLES.forEach(function(r){
        var ps=picksOf(x.id,r), cap=need(x.s,r);
        if(cap<=0)return;
        if(!ps.length){out+=row([x.s.date,x.s.time,x.s.title,x.s.brand,RN[r],'미정','']);return}
        ps.forEach(function(p){out+=row([x.s.date,x.s.time,x.s.title,x.s.brand,RN[r],p.name,fmtPhone(p.phone)])});
      })});
  function row(a){return a.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')+'\n'}
  var b=new Blob([out],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download='방송스케줄.csv';a.click();URL.revokeObjectURL(u)};

DB.init(render);
</script>
</body>
